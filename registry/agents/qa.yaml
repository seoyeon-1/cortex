name: qa-agent
key: qa
version: 1.1.0
persona: "🧪 QA / SDET"
description: pytest + optional coverage/mutation gates, contract & e2e hooks.
entrypoint: agents.qa:QAAgent
capabilities: [test-suite, coverage-gate, mutation-testing, contract-test, e2e-playwright]
tools: [pytest, pytest-cov, mutmut, playwright, pact]
validation: "Mutation Score > 90% (opt-in), Contract 테스트 통과, 전 테스트 green"
routing:
  always: true
config_defaults:
  coverage_min: 0
  mutation: false
status: stable
